<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Published Profile</title>

    <link rel="stylesheet" href="css/publish.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <img id="profilePhoto" src="images/default.png">

            <h1 id="name"></h1>

            <p id="bio"></p>

            <div id="links"></div>

            <button id="shareBtn">

                <i class="fa-solid fa-share-nodes"></i>

                Share Profile

            </button>

        </div>

    </div>

    <script src="js/publish.js"></script>

</body>

</html>
